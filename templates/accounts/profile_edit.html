{% extends "app_base.html" %}
{% block title %}Edit profile · Tagapudo{% endblock %}
{% block content %}
<header class="page-head"><h1>Edit profile</h1></header>
<section class="card" style="max-width:600px">
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <div class="form-actions">
      <button class="btn" type="submit">Save changes</button>
      <a class="btn ghost" href="{% url 'profile' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
